# Core defaults for CMSSW and cmssw-tools.
# OS-specific settings live in os/{os}/vars.yaml; flavor settings in flavor/{flavor}/vars.yaml.

# --- Source / config ---
configtag:     V09-11-03
srctree:       src
bootstrapfile: config/bootsrc.xml

# --- Compiler / build ---
scram_compiler:   gcc
buildtarget:      release-build
enable_biglib:    "1"
skipreqtools:     jcompiler rivet2 opencl opencl-cpp intel-vtune icx-cxxcompiler icx-ccompiler icx-f77compiler mpich
extra_tools:      ""
remove_tools:     ""
compile_options:  ""
nolibchecks:      ""
usercxxflags:     ""

# Vectorization targets come from ../vectorization/config.yaml in package.py.
# Layers may override package_vectorization (empty disables it) and
# scram_target_default (normally auto).

# --- Release flags ---
release_usercxxflags: ""
release_userldflags:  ""

# --- GPU ---
gpu_backend_specific_packages: ""
gpu_types:                     ""
cuda_gcc_support:              "true"

# --- Debug / profiling ---
subpackageDebug:        "0"
saveDeps:               "yes"
runGlimpse:             "yes"
enable_frame_pointer:   "1"
ignore_compile_errors:  ""

# --- Build targets ---
prebuildtarget:         ""
additionalBuildTarget0: ""
postbuildtarget:        ""
