# Core defaults for CMSSW and cmssw-tools.
# Architecture-specific settings are in arch/{arch}/vars.yaml

# --- Source / config ---
branch:        master
configtag:     V09-09-03
srctree:       src
bootstrapfile: config/bootsrc.xml

# --- Compiler / build ---
scram_compiler:   gcc
buildtarget:      release-build
enable_biglib:    "1"
skipreqtools:     jcompiler rivet2 opencl opencl-cpp intel-vtune icx-cxxcompiler icx-ccompiler icx-f77compiler mpich
extra_tools:      ""
remove_tools:     ""
compile_options:  ""
nolibchecks:      ""
usercxxflags:     ""

# --- Build-body compatibility ---
# Arch/vectorization/microarch support was removed. These two keys are kept
# empty only because scram-project-build.sh still references them via
# %(...)s under strict substitution; leaving them empty disables vectorization.
package_vectorization: ""
scram_target_default:  ""

# --- Release flags ---
release_usercxxflags: ""
release_userldflags:  ""

# --- GPU ---
gpu_backend_specific_packages: ""
gpu_types:                     ""
use_cuda:                      "1"
use_rocm:                      "1"
cuda_gcc_support:              "true"

# --- Debug / profiling ---
subpackageDebug:        "yes"
saveDeps:               "yes"
runGlimpse:             "yes"
enable_frame_pointer:   "1"
use_system_gcc:         "0"
ignore_compile_errors:  ""

# --- Build targets ---
prebuildtarget:         ""
additionalBuildTarget0: ""
postbuildtarget:        ""

# --- PGO ---
pgo_generate:    ""
pgo_build_flags: ""

# --- Runtime / misc ---
HFI_NO_BACKTRACE:   "1"
IPATH_NO_BACKTRACE: "1"
