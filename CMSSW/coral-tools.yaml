package: coral-tools
version: "v1"
sources:
  - https://github.com/akritkbehera/scram-tools.file/archive/%(tag)s.tar.gz
variables:
  tag: b4aa6b6ef00452aebb21ec4744d99c792bc6b521
  skipreqtools: jcompiler
  override_microarch: "-march=x86-64-v2"
  package_vectorization: ""
  vectorized_packages: ""
  gpu_backend_specific_packages: ""
  gpu_types: ""
  default_microarch: "-march=x86-64-v2"
  cuda_gcc_support: "true"
  override_microarch_name: ""
  min_microarch_name: "-march=x86-64-v2"
  use_system_gcc: "0"
requires:
  # Core build toolchain
  - gcc
  # Python and its dependencies
  - Python
  - zlib
  - bz2lib
  - expat
  - xz
  - db6
  - libuuid
  - gdbm
  - libffi
  - sqlite
  - curl
  # HPC and parallel computing libraries
  - numactl
  - fmt
  - zstd
  # GPU support (NVIDIA and AMD)
  - cuda
  - rocm
  # High-performance networking and communication
  - xpmem
  - gdrcopy
  - rdma-core
  - libpciaccess
  - libxml2
  - hwloc
  - libfabric
  - ucx
  # MPI and network utilities
  - pacparser
  - openmpi
  # XML processing and testing
  - xerces-c
  - cppunit
  - pcre
  # CMS-specific dependencies
  - frontier_client
  - boost
  - oracle
hook: disable
